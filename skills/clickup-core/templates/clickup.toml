[workspace]
id = "123456"
space_id = "234567"
default_list = "development"

[auth]
env_var = "CLICKUP_API_PERSONAL_TOKEN"
# Optional operator-owned file; never put the token here.
# env_file = "~/.config/my-project.env"

[lists.development]
id = "345678"
statuses = ["to do", "in progress", "to test", "complete"]
default_status = "to do"
closed_status = "complete"

[members.author]
id = 101
name = "Alex Example"
[members.reviewer]
id = 102
name = "Sam Example"

[priorities]
urgent = 1
high = 2
normal = 3
low = 4

[policy]
require_assignee = true
require_priority = false
handoff_status = "to test"
handoff_mode = "counterpart" # or assignee: one existing assignee other than token owner
handoff_pair = ["author", "reviewer"]
