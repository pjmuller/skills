[project]
name = "google-workspace-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["google-auth>=2.62.0", "google-auth-oauthlib>=1.5.0", "httpx>=0.27", "python-dotenv>=1.2.4", "requests>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
