# eMudhra / emSign intermediate CA key compromise, October 2026.
# Advisory: https://emudhra.we-have-a-problem.com/
# Cross-checked against https://ctlogs.dev/blog/emudhra-ca-compromise on 2026-10-26.
#
# Eight intermediates had private keys recoverable from public certificate data (3-8 bit keys).
# Each exists twice with the same key: once under an emSign root, once cross-signed by Sectigo's
# "AAA Certificate Services". A trust store is only safe once BOTH anchors are gone, which is what
# patched bundles do. Removing the emSign roots alone leaves the cross-signed half trusted.

ADVISORY_NAME="eMudhra/emSign intermediate CA compromise (2026-10)"

# A PEM bundle is AFFECTED if it contains any of these subjects.
AFFECTED_ROOTS="emSign ECC Root CA - G3
AAA Certificate Services"

# Hosts serving leaves signed by the compromised intermediates. A protected client rejects all of
# them. Two chains that fail independently, so always test both.
TEST_HOSTS="dv-g3b-emudhra.we-have-a-problem.com
dv-g3b-aaa-emudhra.we-have-a-problem.com"
CONTROL_HOST="github.com"

# Subject CN pattern of the compromised intermediates.
AFFECTED_CN_REGEX='EM (DV|OV|EV) TLS CA - G3[BC]|EM OV CS CA - G3[BC]'

