name: T3 portability

on:
  pull_request:
    paths:
      - 'skills/t3-manage-thread/**'
      - 'skills/t3-schedule/**'
      - '.github/workflows/t3-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Linux shell dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq
      - name: Test thread helpers and scheduler
        run: uv run --with pytest pytest skills/t3-manage-thread/scripts skills/t3-schedule/scripts -q
      - name: Native launchd smoke job
        if: runner.os == 'macOS'
        run: uv run skills/t3-schedule/scripts/smoke-native-scheduler
