name: Dependencies

on:
  pull_request:
    paths:
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.13'
      - name: Shell dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh jq
      - name: Check committed locks
        run: |
          # WhatsApp's lock needs its locally built Neonize source.
          for lock in uv.lock skills/{clickup-core,google-workspace-core,yuki-core}/uv.lock; do
            uv lock --check --project "$(dirname "$lock")"
          done
      - name: Test skills
        run: uv run --locked --with pytest pytest skills -q
      - name: Test ClickUp with its shipped lock
        run: uv run --project skills/clickup-core --locked --with pytest pytest skills/clickup-core/scripts -q
