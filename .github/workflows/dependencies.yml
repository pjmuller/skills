name: Dependencies

on:
  # Every change: most work lands straight on main, so code-only pushes need the suite too.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.13'
      - name: Shell dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh jq
      - name: Check committed locks
        run: |
          # WhatsApp's lock needs its locally built Neonize source.
          for lock in uv.lock skills/{clickup-core,google-workspace-core,yuki-core}/uv.lock; do
            uv lock --check --project "$(dirname "$lock")"
          done
      - name: Test skills
        run: uv run --locked --with pytest --with pytest-xdist pytest skills -q -n 4
      - name: Test ClickUp with its shipped lock
        run: uv run --project skills/clickup-core --locked --with pytest pytest skills/clickup-core/scripts -q
